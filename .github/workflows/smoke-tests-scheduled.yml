name: Scheduled Smoke Tests

# NOTE:
# - GitHub disables scheduled workflows after 60 days of repo inactivity.
# - UptimeRobot remains the fallback liveness check

on:
    schedule:
        - cron: "13,43 * * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    smoke-test:
        name: Run production smoke tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Run smoke tests (health, cooldown, stats)
              working-directory: backend
              env:
                  SMOKE_URL: ${{ vars.SMOKE_URL }}
              run: npm run test:smoke -- health cooldown stats
