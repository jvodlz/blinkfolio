name: Secrets Scan

on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "34 2 * * *"

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
